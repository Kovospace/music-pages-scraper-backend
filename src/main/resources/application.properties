server.port=4000

# Datasource is configured entirely from the environment using Spring's own
# relaxed-binding names, so nothing DB-specific is baked into the image:
#   SPRING_DATASOURCE_URL       jdbc:postgresql://<host>:5432/<db>
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# The driver class is auto-detected from the URL.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL95Dialect

# Flyway falls back to the datasource above. To migrate with a separate, more
# privileged account, set SPRING_FLYWAY_URL / _USER / _PASSWORD in the environment.
spring.flyway.enabled=true
spring.flyway.group=true
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate

# OpenAPI / Swagger UI
#   spec:  /v3/api-docs  (JSON) and /v3/api-docs.yaml
#   UI:    /swagger-ui.html  -> redirects to /swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.writer-with-order-by-keys=true

# Behind the reverse proxy on music-pages-scraper.matejkovac.sk the app only sees
# http://<container>:4000. Honouring X-Forwarded-* makes Swagger UI's "Try it out"
# fire requests at the public https URL instead of the internal one.
server.forward-headers-strategy=framework

platforms={\
  'bandzone':'Bandzone',\
  'freeteknomusic':'FreeTeknoMusic'\
}