plugins {
    id 'org.springframework.boot' version '2.4.4'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'java'
}

group = 'com.kovospace'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '1.8'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // scraper
    implementation 'org.jsoup:jsoup:1.13.1'
    // DB
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // 42.2.x is the last driver line that still runs on the Java 8 JRE base image
    runtimeOnly 'org.postgresql:postgresql:42.2.20'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'com.h2database:h2:1.4.200'
    //flyway
    implementation 'org.flywaydb:flyway-core'
    // OpenAPI 3 spec + Swagger UI; 1.6.x is the last springdoc line built for Java 8
    implementation 'org.springdoc:springdoc-openapi-ui:1.6.15'
    // libs
    implementation 'org.modelmapper:modelmapper:2.4.0'
    implementation 'com.google.code.gson:gson:2.8.9'
    // Build-time only (never ends up in the jar), so this is free to track the JDK doing the
    // building - 1.18.22 cannot run its annotation processor on anything past JDK 17. The
    // emitted bytecode level is decided by sourceCompatibility above, not by this.
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
}

test {
    useJUnitPlatform()
}
